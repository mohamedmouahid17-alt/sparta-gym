<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARTA GYM - Reviews</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090909;
    color: white;
    font-family: Arial, sans-serif;
    padding: 25px 15px;
}

.container {
    max-width: 480px;
    margin: 25px auto;
}

h1 {
    text-align: center;
    color: #d6ad55;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 30px;
}

.card {
    background: #191919;
    border: 1px solid #a98643;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
}

h2 {
    color: #d6ad55;
    font-size: 19px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin: 13px 0 7px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    background: #090909;
    border: 1px solid #555;
    border-radius: 7px;
    color: white;
    font-size: 15px;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    background: #d6ad55;
    color: #111;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
}

.review {
    border-bottom: 1px solid #444;
    padding: 15px 0;
}

.review:last-child {
    border: none;
}

.review-name {
    color: #d6ad55;
    font-weight: bold;
}

.stars {
    color: #f2c14e;
    margin: 7px 0;
}

.review-date {
    color: #888;
    font-size: 12px;
    margin-top: 8px;
}

.back {
    display: block;
    text-align: center;
    color: #d6ad55;
    text-decoration: none;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">

<h1>GOOGLE REVIEWS</h1>
<p class="subtitle">SPARTA GYM MARTIL</p>

<div class="card">
    <h2>Leave Your Review ⭐</h2>

    <form id="reviewForm">
        <label>Your Name</label>
        <input type="text" id="name" required maxlength="60"
               placeholder="Enter your name">

        <label>Your Rating</label>
        <select id="rating">
            <option value="5">⭐⭐⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="2">⭐⭐</option>
            <option value="1">⭐</option>
        </select>

        <label>Your Review</label>
        <textarea id="review" required maxlength="500"
                  placeholder="Write your experience..."></textarea>

        <button type="submit" id="submitBtn">SUBMIT REVIEW</button>
        <p id="status"></p>
    </form>
</div>

<div class="card">
    <h2>Customer Reviews</h2>
    <div id="reviewsList">Loading reviews...</div>
</div>

<a class="back" href="index.html">← Back to Home</a>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxk0ApSW_UVO50bgHEF3AA8yN7ftxchoetCJycO2aHUdRGQobuyWrLZQS_wJQodt7nVqw/exec";

function jsonp(params) {
    return new Promise((resolve, reject) => {
        const callbackName = "reviewCallback_" + Date.now() +
            "_" + Math.floor(Math.random() * 10000);

        const script = document.createElement("script");
        const url = new URL(API_URL);

        Object.keys(params).forEach(key => {
            url.searchParams.set(key, params[key]);
        });

        url.searchParams.set("callback", callbackName);

        const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
        }, 15000);

        function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
        }

        window[callbackName] = data => {
            cleanup();
            resolve(data);
        };

        script.onerror = () => {
            cleanup();
            reject(new Error("Connection failed"));
        };

        script.src = url.toString();
        document.body.appendChild(script);
    });
}

function loadReviews() {
    const list = document.getElementById("reviewsList");
    list.textContent = "Loading reviews...";

    jsonp({ action: "list" })
        .then(reviews => {
            list.innerHTML = "";

            if (!Array.isArray(reviews) || reviews.length === 0) {
                list.textContent = "Be the first to leave a review!";
                return;
            }

            reviews.forEach(item => {
                const box = document.createElement("div");
                box.className = "review";

                const name = document.createElement("div");
                name.className = "review-name";
                name.textContent = item.name || "Anonymous";

                const stars = document.createElement("div");
                stars.className = "stars";

                const rating = Math.max(0, Math.min(5,
                    Number(item.rating) || 0));

                stars.textContent =
                    "★".repeat(rating) + "☆".repeat(5 - rating);

                const message = document.createElement("p");
                message.textContent = item.review || "";

                const date = document.createElement("div");
                date.className = "review-date";
                date.textContent = item.date
                    ? new Date(item.date).toLocaleDateString()
                    : "";

                box.append(name, stars, message, date);
                list.appendChild(box);
            });
        })
        .catch(error => {
            list.textContent = "Could not load reviews. Please refresh.";
            console.error(error);
        });
}

document.getElementById("reviewForm").addEventListener("submit",
    async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const rating = document.getElementById("rating").value;
        const review = document.getElementById("review").value.trim();

        const status = document.getElementById("status");
        const button = document.getElementById("submitBtn");

        button.disabled = true;
        button.textContent = "SENDING...";
        status.textContent = "";

        try {
            const result = await jsonp({
                action: "submit",
                name: name,
                rating: rating,
                review: review
            });

            if (!result.success) {
                throw new Error(result.message || "Submission failed");
            }

            status.textContent = "Thank you! Review submitted successfully.";
            this.reset();
            loadReviews();

        } catch(error) {
            status.textContent = "Error: " + error.message;
        }

        button.disabled = false;
        button.textContent = "SUBMIT REVIEW";
    }
);

loadReviews();
</script>

</body>
</html>
