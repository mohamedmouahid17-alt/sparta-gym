<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARTA GYM MARTIL</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    padding: 25px 18px;
}

.container {
    width: 100%;
    max-width: 420px;
    margin: 35px auto;
    text-align: center;
}

.logo {
    color: #D6AD55;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 4px;
}

.subtitle {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 4px;
    margin: 8px 0 35px;
}

.welcome {
    font-size: 25px;
    margin-bottom: 10px;
}

.description {
    color: #ccc;
    font-size: 14px;
    margin-bottom: 30px;
}

.option {
    display: flex;
    align-items: center;
    gap: 17px;
    width: 100%;
    padding: 22px;
    margin-bottom: 17px;
    background: #171717;
    border: 1px solid #B99A38;
    border-radius: 14px;
    text-decoration: none;
    color: white;
}

.option-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 30px;
    background: #252525;
}

.option-text {
    text-align: left;
}

.option-text h2 {
    color: #D6AD55;
    font-size: 17px;
    margin-bottom: 6px;
}

.option-text p {
    color: #aaa;
    font-size: 12px;
}

.arrow {
    margin-left: auto;
    color: #D6AD55;
    font-size: 25px;
}

.footer {
    color: #D6AD55;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 35px;
}

#reviewsPage {
    display: none;
}

.back {
    color: #D6AD55;
    background: none;
    border: none;
    font-size: 15px;
    margin-bottom: 25px;
    cursor: pointer;
}

.review-box {
    background: #171717;
    border: 1px solid #B99A38;
    border-radius: 14px;
    padding: 22px;
    margin-top: 20px;
}

.review-box h2 {
    color: #D6AD55;
    margin-bottom: 18px;
}

.stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 15px 0 22px;
}

.star {
    background: none;
    border: none;
    color: #555;
    font-size: 38px;
    cursor: pointer;
}

.star.active {
    color: #D6AD55;
}

input, textarea {
    width: 100%;
    padding: 13px;
    margin-bottom: 13px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #252525;
    color: white;
    font-size: 14px;
}

textarea {
    height: 110px;
    resize: vertical;
}

.send {
    width: 100%;
    padding: 14px;
    background: #D6AD55;
    color: #080808;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 14px;
    font-size: 13px;
    color: #D6AD55;
}

.review-item {
    text-align: left;
    background: #171717;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px;
    margin-top: 12px;
}

.review-item .gold {
    color: #D6AD55;
    margin-bottom: 8px;
}

.review-item p {
    color: #ddd;
    margin-top: 8px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.review-item small {
    color: #888;
}

.section-title {
    color: #D6AD55;
    margin: 28px 0 12px;
}
</style>
</head>

<body>

<div class="container">

    <div id="homePage">
        <div class="logo">SPARTA GYM</div>
        <div class="subtitle">MARTIL</div>

        <h1 class="welcome">WELCOME</h1>
        <p class="description">Choose your destination</p>

        <a class="option"
           href="https://www.instagram.com/sparta.gym.martil/">
            <div class="option-icon">
    <svg viewBox="0 0 24 24" width="32" height="32">
        <defs>
            <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FFD776"/>
                <stop offset="50%" stop-color="#F56040"/>
                <stop offset="100%" stop-color="#833AB4"/>
            </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="6"
              fill="none" stroke="url(#ig)" stroke-width="2.5"/>
        <circle cx="12" cy="12" r="4.5"
                fill="none" stroke="url(#ig)" stroke-width="2.5"/>
        <circle cx="18" cy="6" r="1.3" fill="#F56040"/>
    </svg>
</div>
            <div class="option-text">
                <h2>INSTAGRAM</h2>
                <p>Follow our gym</p>
            </div>
            <div class="arrow">›</div>
        </a>

        <button class="option" onclick="openReviews()">
            <div class="option-icon">⭐</div>
            <div class="option-text">
                <h2>REVIEWS</h2>
                <p>Share your experience</p>
            </div>
            <div class="arrow">›</div>
        </button>

        <div class="footer">THANK YOU FOR YOUR SUPPORT</div>
    </div>

    <div id="reviewsPage">
        <button class="back" onclick="goHome()">← BACK</button>

        <div class="logo">SPARTA GYM</div>
        <div class="subtitle">YOUR OPINION MATTERS</div>

        <div class="review-box">
            <h2>WRITE A REVIEW</h2>

            <input id="name" type="text"
                   placeholder="Your name (optional)">

            <p style="color:#ccc">Choose your rating</p>

            <div class="stars">
                <button class="star" onclick="chooseStar(1)">★</button>
                <button class="star" onclick="chooseStar(2)">★</button>
                <button class="star" onclick="chooseStar(3)">★</button>
                <button class="star" onclick="chooseStar(4)">★</button>
                <button class="star" onclick="chooseStar(5)">★</button>
            </div>

            <textarea id="review"
                      placeholder="Write your review here..."></textarea>

            <button class="send" onclick="sendReview()">
                SEND REVIEW
            </button>

            <div id="message"></div>
        </div>

        <h2 class="section-title">CUSTOMER REVIEWS</h2>
        <div id="reviewsList">Loading reviews...</div>

        <div class="footer">SPARTA GYM MARTIL</div>
    </div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwW1SyhpX0BG3cSIwYyWQGKFxREIiO3IDB_xjG8xH86PW-8W8Av87SmPiWxUJh1OG6AVw/exec";

let selectedStars = 0;

function openReviews() {
    document.getElementById("homePage").style.display = "none";
    document.getElementById("reviewsPage").style.display = "block";
    loadReviews();
}

function goHome() {
    document.getElementById("reviewsPage").style.display = "none";
    document.getElementById("homePage").style.display = "block";
}

function chooseStar(number) {
    selectedStars = number;

    document.querySelectorAll(".star").forEach((star, index) => {
        star.classList.toggle("active", index < number);
    });
}

async function sendReview() {
    const name = document.getElementById("name").value.trim();
    const review = document.getElementById("review").value.trim();
    const message = document.getElementById("message");

    if (selectedStars === 0) {
        message.textContent = "Please choose your stars.";
        return;
    }

    if (!review) {
        message.textContent = "Please write your review.";
        return;
    }

    message.textContent = "Sending...";

    try {
        await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                name: name || "Anonymous",
                stars: selectedStars,
                review: review
            })
        });

        message.textContent =
            "Thank you! Your review has been sent.";

        document.getElementById("name").value = "";
        document.getElementById("review").value = "";
        selectedStars = 0;
        chooseStar(0);

        setTimeout(loadReviews, 1500);

    } catch (error) {
        message.textContent = "Something went wrong. Try again.";
    }
}

async function loadReviews() {
    const list = document.getElementById("reviewsList");
    list.textContent = "Loading reviews...";

    try {
        const response = await fetch(API_URL);
        const reviews = await response.json();

        list.innerHTML = "";

        if (!reviews.length) {
            list.textContent = "Be the first to leave a review!";
            return;
        }

        reviews.reverse().forEach(item => {
            const card = document.createElement("div");
            card.className = "review-item";

            const stars = document.createElement("div");
            stars.className = "gold";
            stars.textContent = "★".repeat(
                Math.min(5, Math.max(0, Number(item.stars) || 0))
            );

            const author = document.createElement("strong");
            author.textContent = item.name || "Anonymous";

            const comment = document.createElement("p");
            comment.textContent = item.review || "";

            card.append(stars, author, comment);
            list.appendChild(card);
        });

    } catch (error) {
        list.textContent = "Could not load reviews. Please try again.";
    }
}
</script>

</body>
</html>
