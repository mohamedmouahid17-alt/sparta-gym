<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPARTA GYM MARTIL</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 390px;
    text-align: center;
}

.logo {
    width: 125px;
    height: 125px;
    object-fit: contain;
    margin-bottom: 18px;
}

h1 {
    color: #d6ad55;
    font-size: 27px;
    letter-spacing: 3px;
}

.subtitle {
    color: #aaa;
    font-size: 13px;
    letter-spacing: 5px;
    margin-top: 8px;
    margin-bottom: 40px;
}

.option {
    display: flex;
    align-items: center;
    gap: 17px;
    width: 100%;
    padding: 19px;
    margin-bottom: 18px;
    background: linear-gradient(145deg, #1c1c1c, #101010);
    border: 1px solid #a98643;
    border-radius: 13px;
    text-decoration: none;
    color: white;
    transition: 0.25s;
}

.option:hover {
    border-color: #f0cc77;
    transform: translateY(-3px);
}

.option-icon {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #d6ad55;
    color: #111;
    border-radius: 10px;
    flex-shrink: 0;
}

.option-icon svg {
    width: 27px;
    height: 27px;
}

.option-text {
    text-align: left;
}

.option-text h2 {
    font-size: 16px;
    color: #e5c477;
    letter-spacing: 1px;
}

.option-text p {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
}

.arrow {
    margin-left: auto;
    color: #d6ad55;
    font-size: 23px;
}

footer {
    color: #666;
    font-size: 11px;
    margin-top: 35px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

    <h1>SPARTA GYM</h1>
    <p class="subtitle">MARTIL</p>

    <!-- INSTAGRAM -->
    <a class="option"
       href="https://www.instagram.com/sparta.gym.martil/"
       target="_blank"
       rel="noopener">

        <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="1"
                        fill="currentColor" stroke="none"/>
            </svg>
        </div>

        <div class="option-text">
            <h2>INSTAGRAM</h2>
            <p>Follow us on Instagram</p>
        </div>

        <span class="arrow">›</span>
    </a>

    <!-- GOOGLE REVIEWS -->
    <a class="option" href="reviews.html">

        <div class="option-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.5l2.9 5.9 6.6 1-4.8 4.7
                1.1 6.6-5.8-3.1-5.8 3.1
                1.1-6.6-4.8-4.7 6.6-1z"/>
            </svg>
        </div>

        <div class="option-text">
            <h2>GOOGLE REVIEWS</h2>
            <p>Share your experience with us</p>
        </div>

        <span class="arrow">›</span>
    </a>

    <footer>
        SPARTA GYM MARTIL
    </footer>

</div>

</body>
</html>
